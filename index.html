<script type="module">
/* ═══ BOWLING NIGHT · a Multiplayer Agent starter ═════════════════════════════════════════
 * Ten frames on one lane, real scoring. Turn-based, 2–6 players; everyone watches each roll
 * live; bots take the empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ seats, timings, lane size, ball and pin physics, swipe feel, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   SCORING ....... strikes, spares, the tenth frame, whose turn it is
 *   PHYSICS ....... one roll from start to finish: the ball's hook, pins hitting pins
 *   LANE .......... renderer, lights, the lane, gutters, neighbouring lanes, neon
 *   PINS & BALL ... the pin and ball models, drawing a roll, sweeping the deck
 *   GAME (HOST) ... seats, checking and starting rolls, scoring them, bot turns, results.
 *                   Only the host writes the shared `game` field.
 *   MY TURN ....... lining up, the swipe, sending a roll
 *   HUD & RESULTS . score sheet, pin diagram, turn banner, results card, leaderboard
 *   INPUT / LOOP .. pointer and keys, the camera, the main loop
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The whole game lives in ONE shared field, `game`: {id, v, phase, seats, pins, roll,
 *     rollN, turnAt, bx, endsAt}. `seats` holds each bowler's id, name, color and rolls.
 *     Only the HOST writes it, and `v` goes up on every write.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. A new host carries on from `game`.
 *   - The bowler sends the intent "roll" {g, n, x, vx, vz, sp} (where the ball starts, its
 *     velocity and spin). The host checks it is that seat's turn, simulates the roll to the
 *     end to know the pinfall, and writes `game.roll` with the launch. Every client replays
 *     the launch with the same fixed-step physics, so everyone watches the same roll live.
 *     When the pins have settled the host adds the pinfall to the seat's rolls and moves on.
 *   - Each player writes its OWN entity: `n`/`c` (name, color), `hb` (heartbeat) and, on its
 *     turn, `l` (where it is lining the ball up) so the others see the ball slide.
 *   - A seat whose player is gone for 10s goes to a bot (it keeps the score); someone who
 *     joins takes a bot's seat, or a new seat in the first two frames, or watches.
 *   - Intent "again" {} from the results card asks the host to start a new game now.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "high-game": each player's best game, shown on the results card.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 3,              // bots fill the bowling order up to this many
  maxSeats: 6,           // the most bowlers in one game
  botThinkMs: 1400,      // a bot lines up this long before it rolls
  settleMs: 1100,        // ms the pins stay down after they stop, before the sweep
  turnMs: 30000,         // a player who doesn't roll in this long gets a roll made for them
  seatGraceMs: 10000,    // a seated player silent this long loses the seat to a bot
  resultsMs: 30000,      // results show this long, then a new game starts (Play again starts it at once)
  board: "high-game",
  // The lane, in metres. The foul line is z = 0; the ball rolls toward -z.
  laneHalf: 0.527,       // half the lane's width (the gutters start here)
  gutterX: 0.64,         // where a ball in the gutter runs
  wallX: 0.8,            // the side walls around the pins
  headZ: -18.29,         // the head pin
  pinSpacing: 0.3048, rowDepth: 0.264,
  deckZ: -17.7,          // the pin deck starts here (a ball can't drop into the gutter past it)
  pitZ: -19.4,           // past this, balls and pins fall into the pit
  // Ball and pins
  ballR: 0.108, ballM: 7,
  pinR: 0.06, pinDownR: 0.065, pinM: 1.5, // a fallen pin is longer, so it reaches a little further
  pinBounce: 0.4,        // how bouncy pin hits are
  wallBounce: 0.5,
  knock: 0.5,            // a standing pin hit faster than this (m/s) falls
  pinSlide: 2.5,         // how fast a fallen pin slows down, m/s²
  ballSlow: 0.12,        // how fast the ball slows down, m/s²
  hookAcc: 0.9,          // sideways pull of full spin on the dry end of the lane, m/s²
  oilEnd: -8,            // the oil ends here: the ball starts to hook...
  hookRamp: 4,           // ...and hooks fully this many metres later
  // The swipe
  speedMin: 6, speedMax: 10,     // m/s for a slow swipe and a fast flick
  swipeSlow: 0.5, swipeFast: 2.6, // swipe speed in screen heights per second for those
  aimScale: 0.15,        // lane angle per radian of swipe angle
  aimMax: 0.05,          // the widest angle, radians
  spinFromBow: 4,        // how much a curved swipe spins the ball
  // Bots
  botNames: ["Lucky Strike", "Gutter Gus", "Spare Ribs", "Pin Pal", "Split Kit", "Lane Jane"],
  botAimErr: 0.12,       // how far a bot misses its target at the pins, metres
  botSpeedErr: 0.35,     // m/s
};
const COLORS = ["#ff4fd8", "#4de1ff", "#ffd84d", "#7dff7a", "#b28bff", "#ff8c42", "#ff5a6e", "#f5f5f5"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'bowling-night',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
/** JSON from a state field, parsed once per distinct value (read-only: never mutate the result). */
const jsonCache = new Map();
function parse(v, fb) {
  if (typeof v !== "string") return fb;
  if (jsonCache.has(v)) return jsonCache.get(v);
  let out = fb; try { out = JSON.parse(v); } catch {}
  if (jsonCache.size > 200) jsonCache.clear();
  jsonCache.set(v, out); return out;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let hostHold = 0, lastTick = performance.now(); // lastTick: when frame() last ran; hostHold: after a freeze, no hosting before this time (see frame())
const isHost = () => performance.now() > hostHold && performance.now() - lastTick < 1000 && livePlayers()[0] === net.sessionId; // a tab whose loop has stopped doesn't host
/** Still in the room and heard from within the seat grace time (a backgrounded phone keeps its seat). */
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── SCORING ─────────────────────────────────────────────────────────────────────────
// A bowler's game is a flat list of pinfalls, one per ball: [10, 7, 3, 9, 0, ...].
const ALL_PINS = 1023; // one bit per pin; pin 1 (the head pin) is bit 0
const mark = (n) => (n === 0 ? "-" : String(n));
/** The score sheet: each frame's marks ("X", "7/", "9-") and running total (null until it can be counted). */
function scoreSheet(r) {
  const frames = []; let i = 0, total = 0, ok = true;
  for (let f = 0; f < 10; f++) {
    const a = r[i], b = r[i + 1], c = r[i + 2];
    let marks = "", done = false, pts = 0;
    if (a === undefined) { frames.push({ marks, total: null }); continue; }
    if (f < 9) {
      if (a === 10) { marks = "X"; done = b !== undefined && c !== undefined; pts = 10 + (b || 0) + (c || 0); i += 1; }
      else {
        marks = mark(a) + (b === undefined ? "" : a + b === 10 ? "/" : mark(b));
        done = b !== undefined && (a + b < 10 || c !== undefined); pts = a + (b || 0) + (a + b === 10 ? c || 0 : 0); i += 2;
      }
    } else { // the tenth: a strike or spare earns a third ball
      marks = a === 10 ? "X" : mark(a);
      if (b !== undefined) marks += a === 10 ? (b === 10 ? "X" : mark(b)) : a + b === 10 ? "/" : mark(b);
      if (c !== undefined) marks += (a === 10 && b !== 10) ? (b + c === 10 ? "/" : mark(c)) : c === 10 ? "X" : mark(c);
      done = b !== undefined && (a + b < 10 && a !== 10 ? true : c !== undefined); pts = a + (b || 0) + (c || 0);
    }
    ok = ok && done;
    if (ok) total += pts;
    frames.push({ marks, total: ok ? total : null });
  }
  return { frames, total };
}
/** The next ball for this bowler: its frame (0-9), whether the rack is fresh, or done. */
function nextBall(r) {
  let i = 0;
  for (let f = 0; f < 9; f++) {
    if (r[i] === undefined) return { frame: f, ball: 0, fresh: true };
    if (r[i] === 10) { i += 1; continue; }
    if (r[i + 1] === undefined) return { frame: f, ball: 1, fresh: false };
    i += 2;
  }
  const [a, b, c] = [r[i], r[i + 1], r[i + 2]];
  if (a === undefined) return { frame: 9, ball: 0, fresh: true };
  if (b === undefined) return { frame: 9, ball: 1, fresh: a === 10 };
  if (c === undefined && (a === 10 || a + b === 10)) return { frame: 9, ball: 2, fresh: b === 10 || (a !== 10 && a + b === 10) };
  return { frame: 10, done: true };
}
/** Whose turn: the seat furthest behind, the first one on a tie (so a frame is finished before the next seat goes). */
function currentSeat(g) {
  let best = -1, bestFrame = 99;
  g.seats.forEach((s, i) => { const nb = nextBall(s.r); if (!nb.done && nb.frame < bestFrame) { bestFrame = nb.frame; best = i; } });
  return best;
}
const popcount = (m) => { let n = 0; for (; m; m &= m - 1) n++; return n; };

// ── PHYSICS ─────────────────────────────────────────────────────────────────────────
// A roll is simulated in fixed 1/240 s steps with only + - * / and sqrt, so every browser
// replays a launch exactly the same way. The host runs it to the end at once to know the
// pinfall; everyone else (and the host's screen) plays it out in real time.
const STEP = 1 / 240;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const r4 = (v) => Math.round(v * 10000) / 10000;
/** Where pin i stands: rows of 1, 2, 3, 4 from the head pin back, left to right. */
const PIN_SPOTS = [];
for (let row = 0; row < 4; row++) for (let k = 0; k <= row; k++) PIN_SPOTS.push({ x: (k - row / 2) * CONFIG.pinSpacing, z: CONFIG.headZ - row * CONFIG.rowDepth });
/** A roll ready to play: the ball at its launch, the pins of `mask` standing. */
function newSim(mask, roll) {
  return {
    t: 0, acc: 0, quiet: 0, settled: false, hits: 0, gutterAt: -1,
    ball: { x: roll.x, z: 0, vx: roll.vx, vz: roll.vz, sp: roll.sp, gutter: false, gone: false },
    pins: PIN_SPOTS.map((p, i) => ({ i, x: p.x, z: p.z, vx: 0, vz: 0, up: (mask >> i) & 1, down: false, gone: !((mask >> i) & 1), fall: 0, fx: 0, fz: 0, pit: 0 })),
  };
}
const standing = (o) => o.up && !o.down;
/** Two circles touching: push them apart and trade momentum. A standing pin hit hard enough falls (and only then moves). */
function hit(s, a, ra, ma, b, rb, mb) {
  const dx = b.x - a.x, dz = b.z - a.z, d2 = dx * dx + dz * dz, rr = ra + rb;
  if (d2 >= rr * rr || d2 < 1e-12) return;
  const d = Math.sqrt(d2), nx = dx / d, nz = dz / d;
  const closing = (a.vx - b.vx) * nx + (a.vz - b.vz) * nz;
  for (const o of [a, b]) if (standing(o) && closing > CONFIG.knock) { o.down = true; o.fx = o === a ? -nx : nx; o.fz = o === a ? -nz : nz; }
  const ia = standing(a) ? 0 : 1 / ma, ib = standing(b) ? 0 : 1 / mb;
  if (ia + ib === 0) return;
  const push = (rr - d) / (ia + ib);
  a.x -= nx * push * ia; a.z -= nz * push * ia; b.x += nx * push * ib; b.z += nz * push * ib;
  if (closing > 0) {
    const j = ((1 + CONFIG.pinBounce) * closing) / (ia + ib);
    a.vx -= j * ia * nx; a.vz -= j * ia * nz; b.vx += j * ib * nx; b.vz += j * ib * nz;

}
const pinR = (p) => (p.down ? CONFIG.pinDownR : CONFIG.pinR);
/** One fixed step of a roll. */
function simStep(s) {
  const C = CONFIG, b = s.ball;

    if (!b.gutter) b.vx += b.sp * C.hookAcc * clamp((C.oilEnd - b.z) / C.hookRamp, 0, 1) * STEP; // the hook, on the dry end
    const v = Math.sqrt(b.vx * b.vx + b.vz * b.vz);
    if (v > 0) { const k = Math.max(0, v - C.ballSlow * STEP) / v; b.vx *= k; b.vz *= k; }
    b.x += b.vx * STEP; b.z += b.vz * STEP;

    if (b.x > C.wallX - C.ballR) { b.x = C.wallX - C.ballR; b.vx = -b.vx * C.wallBounce; }
    if (b.x < -C.wallX + C.ballR) { b.x = -C.wallX + C.ballR; b.vx = -b.vx * C.wallBounce; }

  const moving = s.pins.some((p) => p.down && !p.gone && p.vx * p.vx + p.vz * p.vz > 0.0025);

/** Play a roll for dt seconds of real time. */
function simRun(s, dt) { s.acc += dt; while (s.acc >= STEP && !s.settled) { s.acc -= STEP; simStep(s); } }

const downMask = (s) => s.pins.reduce((m, p) => (p.up && p.down ? m | (1 << p.i) : m), 0);

/** A launch from x with speed, angle and spin, rounded so every client replays the same numbers. */
function makeRoll(x, speed, angle, spin) {

}
/** Where a ball (no pins) crosses the head pin's row: what bots aim with. */
function ballXAtPins(roll) {
  const s = newSim(0, roll);

}
/** The angle that sends this ball through targetX at the pins (found by halving the range). */
function angleFor(x, speed, spin, targetX) {

// ── MY TURN ─────────────────────────────────────────────────────────────────────────
const myName = (() => { try { return localStorage.getItem("mpa-name") || ""; } catch { return ""; } })() ||
  ["Cosmic", "Lucky", "Neon", "Disco", "Smooth", "Groovy"][Math.floor(Math.random() * 6)] + " " + ["Bowler", "Roller", "Pinhead", "Hooker", "Striker"][Math.floor(Math.random() * 5)];
let myColor = COLORS[0]; // picked on join: the first color nobody in the room has
const me = { x: 0, sent: "", lastSend: 0, pending: null, rolls: 0, submitted: -1, toastFor: "" };
let swipe = null; // the gesture in progress: { id, sx, sy, x0, mode: "line" | "swipe", pts }
const mySeat = (g) => (g ? g.seats.findIndex((s) => s.id === net.sessionId) : -1);
const myTurn = (g) => g && g.phase === "play" && !g.roll && !me.pending && currentSeat(g) === mySeat(g) && mySeat(g) >= 0;
/** Tell the others where I'm lining up (about 10 times a second while it changes). */
function publishLine(g) {
  const now = performance.now(), v = JSON.stringify({ k: g.rollN, x: +me.x.toFixed(3) });
  if (v === me.sent || now - me.lastSend < 100) return;
  me.sent = v; me.lastSend = now; net.me.set("l", v);
}
/** Turn a finished swipe into a roll: its angle aims, its speed sets the ball speed, its curve spins it. */
function swipeToRoll(pts) {
  const H = innerHeight, a = pts[0], z = pts[pts.length - 1], cx = z.x - a.x, cy = z.y - a.y, len = Math.hypot(cx, cy);
  if (cy > -0.06 * H || len < 0.08 * H) return null; // too short, or not up the lane
  const tail = pts.filter((p) => z.t - p.t < 180), t0 = tail.length > 1 ? tail[0] : pts[Math.max(0, pts.length - 2)], fast = (Math.hypot(z.x - t0.x, z.y - t0.y) / H) / Math.max(0.03, (z.t - t0.t) / 1000);
  const k = clamp((fast - CONFIG.swipeSlow) / (CONFIG.swipeFast - CONFIG.swipeSlow), 0, 1), speed = CONFIG.speedMin + k * (CONFIG.speedMax - CONFIG.speedMin);
  const angle = clamp(Math.atan2(cx, -cy) * CONFIG.aimScale, -CONFIG.aimMax, CONFIG.aimMax);
  let bow = 0; // the farthest the swipe strays from a straight line: + bowed to the right
  for (const p of pts) { const d = ((p.x - a.x) * -cy + (p.y - a.y) * cx) / len; if (Math.abs(d) > Math.abs(bow)) bow = d; }
  return makeRoll(me.x, speed, angle, clamp((-bow / len) * CONFIG.spinFromBow, -1, 1));
}
function roll(r) {
  const g = game();
  if (!myTurn(g)) return;
  me.rolls++;
  if (isHost()) { startRoll(g, currentSeat(g), r); return; }
  me.pending = { ...r, at: performance.now() };
  startReplay({ ...r, s: mySeat(g) }, g.pins, true); // start rolling now; the host's copy will match it
  net.send("roll", { g: g.id, n: g.rollN, ...r });
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let toastTimer = 0;
function toast(text, ms = 1600, small = false) { const m = $("msg"); m.textContent = text; m.classList.toggle("small", small); m.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => m.classList.remove("on"), ms); }
let board = null, boardFor = -1;
/** Colors other players and the bots already use. */
const takenColors = () => new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...((parse(S.shared.game, {}) || {}).seats || []).filter((s) => s.bot).map((s) => s.c)]);
/** Two players with one color (both joined at once): the later sessionId picks again. */
function fixColor() {
  if (!Object.entries(S.entities.players || {}).some(([id, p]) => id < net.sessionId && p.c === myColor)) return;
  const taken = takenColors();
  myColor = COLORS.find((c) => !taken.has(c)) || myColor;
  net.me.set("c", myColor);
}
/** The score sheet: one row per bowler, ten frames and a total. */
function sheetHtml(g, cur) {
  return `<table>${g.seats.map((s, k) => {
    const sh = scoreSheet(s.r), nb = nextBall(s.r), name = s.id === net.sessionId ? "You" : s.n, col = s.bot ? s.c : playerColor(s.id);
    return `<tr class="${k === cur ? "up" : ""} ${s.id === net.sessionId ? "me" : ""}"><td class="nm"><i style="background:${esc(col)}"></i>${esc(name)}</td>` +
      sh.frames.map((f, i) => `<td class="${k === cur && nb.frame === i ? "now" : ""}"><b>${f.marks}</b>${f.total ?? ""}</td>`).join("") + `<td class="tot">${sh.total}</td></tr>`;
  }).join("")}</table>`;
}
let sheetKey = "";
function hud(g) {
  fixColor();
  if (ATTRACT) { for (const id of ["sheet", "turn", "pins", "net", "hint"]) $(id).textContent = ""; $("over").hidden = true; return; }
  const cur = currentSeat(g), seat = g.seats[cur], key = `${g.v}|${cur}|${myColor}`;
  if (key !== sheetKey) { sheetKey = key; $("sheet").innerHTML = sheetHtml(g, cur); document.documentElement.style.setProperty("--sheet", `${$("sheet").offsetHeight + 8}px`); }
  const mine = seat && seat.id === net.sessionId, nb = seat ? nextBall(seat.r) : null;
  const left = Math.ceil((g.turnAt + CONFIG.turnMs - Date.now()) / 1000);
  $("turn").className = "hud" + (mine && !g.roll ? " mine" : "");
  const watching = mySeat(g) < 0 ? " · you're watching: you bowl next game" : "";
  $("turn").innerHTML = g.phase !== "play" || !seat ? "" : `${mine ? "Your turn" : `${esc(seat.n)} is up`}<small>Frame ${nb.frame + 1} · Ball ${nb.ball + 1}${mine && !g.roll && left <= 10 ? ` · rolling for you in ${Math.max(0, left)}s` : ""}${watching}</small>`;
  const shown = replay ? replay.sim.pins.map((p) => p.up && !p.down) : PIN_SPOTS.map((_, i) => (view.mask >> i) & 1);
  $("pins").innerHTML = [[6, 7, 8, 9], [3, 4, 5], [1, 2], [0]].map((row) => `<div>${row.map((i) => `<span class="${shown[i] ? "" : "down"}"></span>`).join("")}</div>`).join("");
  $("hint").textContent = mine && !g.roll && me.rolls < 2 ? (innerWidth < 600 ? "Drag sideways to line up. Swipe up to roll; curve it to hook." : "Drag sideways to line up, then swipe up the lane. Curve your swipe to hook the ball.") : "";
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the lane" : ""}`;
  $("over").hidden = g.phase !== "done";
  if (g.phase === "done") showResults(g);
}
function showResults(g) {
  const rows = g.seats.map((s, k) => ({ k, s, tot: scoreSheet(s.r).total })).sort((a, b) => b.tot - a.tot), top = rows[0];
  const tie = rows.length > 1 && rows[1].tot === top.tot;
  $("overTitle").textContent = tie ? `Tie at ${top.tot}!` : top.s.id === net.sessionId ? `You win with ${top.tot}!` : `${top.s.n} wins with ${top.tot}!`;
  if ($("final").dataset.v !== String(g.v)) { $("final").dataset.v = String(g.v); $("final").innerHTML = sheetHtml(g, -1); }
  $("next").textContent = `New game in ${Math.max(0, Math.ceil((g.endsAt - Date.now()) / 1000))}s`;
  if (boardFor !== g.id) { boardFor = g.id; showBoard(g); }
}
function showBoard(g) {
  const list = $("board"), mine = g.seats.find((s) => s.id === net.sessionId);
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  const submit = mine && me.submitted !== g.id ? board.submit(scoreSheet(mine.r).total).catch(() => null) : Promise.resolve();
  me.submitted = g.id;
  list.innerHTML = "<li>Loading…</li>";
  submit.then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No games yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { const g = game(); if (!g || g.phase !== "done") return; if (isHost()) newGame(g.id + 1); else net.send("again", {}); };
/** What a finished roll was: STRIKE!, SPARE!, a split, a gutter ball, or the count. */
function callRoll(rp) {
  const s = rp.sim, before = popcount(rp.mask), down = popcount(downMask(s)), left = rp.mask & ~downMask(s);
  if (down === before && before === 10) return ["STRIKE!", false];
  if (down === before) return ["SPARE!", false];
  if (s.gutterAt >= 0 && down === 0) return ["Gutter ball", true];
  const split = before === 10 && !(left & 1) && popcount(left) >= 2 && isSplit(left);
  return [split ? `Split! ${down}` : down === 0 ? "Missed!" : `${down} pin${down === 1 ? "" : "s"}`, true];
}
/** A split: the head pin is down and the pins left stand in groups with a gap between them. */
function isSplit(left) {
  const xs = PIN_SPOTS.map((p, i) => ((left >> i) & 1 ? Math.round(p.x / (CONFIG.pinSpacing / 2)) : null)).filter((v) => v !== null).sort((a, b) => a - b);
  for (let k = 1; k < xs.length; k++) if (xs[k] - xs[k - 1] > 2) return true;
  return false;
}

// ── INPUT / LOOP ────────────────────────────────────────────────────────────────────
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  if (ATTRACT || swipe || !myTurn(game())) return;
  cv.setPointerCapture(e.pointerId);
  swipe = { id: e.pointerId, sx: e.clientX, sy: e.clientY, x0: me.x, mode: "", pts: [] };
});
cv.addEventListener("pointermove", (e) => {
  if (!swipe || e.pointerId !== swipe.id) return;
  const dx = e.clientX - swipe.sx, dy = e.clientY - swipe.sy;
  if (swipe.mode !== "swipe" && dy < -24) { swipe.mode = "swipe"; swipe.pts = [{ x: e.clientX, y: e.clientY - 1, t: performance.now() - 16 }]; } // going up the lane: a swipe
  else if (!swipe.mode && Math.abs(dx) > 8) swipe.mode = "line";
  if (swipe.mode === "line") me.x = clamp(swipe.x0 + (dx / Math.min(innerWidth, 900)) * 1.3, -(CONFIG.laneHalf - CONFIG.ballR), CONFIG.laneHalf - CONFIG.ballR);
  if (swipe.mode === "swipe") swipe.pts.push({ x: e.clientX, y: e.clientY, t: performance.now() });
});
cv.addEventListener("pointerup", (e) => {
  if (!swipe || e.pointerId !== swipe.id) return;
  const s = swipe; swipe = null;
  if (s.mode === "swipe" && s.pts.length > 2) { const r = swipeToRoll(s.pts); if (r) roll(r); }
});
cv.addEventListener("pointercancel", () => { swipe = null; });
addEventListener("keydown", (e) => { // arrow keys line up too
  if (!myTurn(game())) return;
  const half = CONFIG.laneHalf - CONFIG.ballR;
  if (e.key === "ArrowLeft") me.x = clamp(me.x - 0.03, -half, half);
  if (e.key === "ArrowRight") me.x = clamp(me.x + 0.03, -half, half);
});
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// The camera: behind the ball while lining up, riding along with it, then watching the pins.
const cam = { pos: new THREE.Vector3(0, 1.25, 4.2), look: new THREE.Vector3(0, 0, -11) };
const wantPos = new THREE.Vector3(), wantLook = new THREE.Vector3();
function fit() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 62 : 42; camera.updateProjectionMatrix(); }
addEventListener("resize", fit); addEventListener("orientationchange", fit); fit();

let last = performance.now(), lastHb = 0, lastHud = 0, waitX = 0, gameId = -1;
function frame(now) {
  requestAnimationFrame(frame);
  if (performance.now() - lastTick > 1000) hostHold = performance.now() + 700; // the tab was frozen or in the background: let what the stand-in host wrote meanwhile arrive before acting as host
  lastTick = performance.now(); // not the rAF time: after a long freeze Chrome can stamp the first frame from before it ended
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be timed before load: never negative
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); }
  if (isHost()) hostTick();
  const g = game();
  if (g) {
    if (g.id !== gameId) { gameId = g.id; replay = null; me.pending = null; swipe = null; setRack(ALL_PINS); view.drop = 0; me.x = 0; $("over").hidden = true; }
    // a roll in state that I'm not showing yet: show it (or adopt it, if it's my own that I already started)
    if (g.roll && (!replay || replay.n !== g.roll.n)) {
      const r = g.roll, pend = me.pending;
      if (replay && replay.n === null && pend && pend.x === r.x && pend.vx === r.vx && pend.vz === r.vz && pend.sp === r.sp) replay.n = r.n;
      else startReplay(r, r.pm, false);
      me.pending = null;
    }
    if (me.pending && now - me.pending.at > 2500) { me.pending = null; if (replay && replay.n === null) replay = null; } // the host didn't take it
    if (replay) {
      const s = replay.sim, hitsBefore = s.hits;
      if (ATTRACT && !replay.slowAt && s.ball.z < -16.8) replay.slowAt = s.t; // the preview shows the crash in slow motion
      simRun(s, replay.slowAt && s.t < replay.slowAt + 0.8 ? dt * 0.4 : dt);
      if (s.hits > hitsBefore) { crash(s.hits - hitsBefore); if (!replay.burst) { replay.burst = true; burst(s.ball.x, 0.2, s.ball.z, 26, ["#ffffff", "#ff4fd8", "#4de1ff", "#ffd84d"]); } }
      if (s.settled && !replay.toastDone) { replay.toastDone = true; replay.settledAt = now; const [text, small] = callRoll(replay); if (!ATTRACT || !small) toast(text, 1500, small); if (!small) { burst(0, 0.3, CONFIG.headZ - 0.3, 50, ["#ff4fd8", "#4de1ff", "#ffd84d", "#ffffff"]); beep(660, 0.3, "square", 0.06, 1.5); } }
      if (s.settled && now - replay.settledAt > 900 && (!g.roll || g.roll.n !== replay.n) && replay.n !== null) { replay = null; setRack(g.pins); } // show the result a moment, then sweep
    } else setRack(g.pins);
    if (!g.roll && !replay) { // the ball waits at the foul line where the bowler lines it up
      const cur = currentSeat(g), seat = g.seats[cur];
      if (seat) {
        if (seat.id === net.sessionId) { waitX = me.x; publishLine(g); }
        else if (seat.bot) waitX += (g.bx - waitX) * Math.min(1, dt * 3);
        else { const l = parse(S.entities.players[seat.id]?.l, null); if (l && l.k === g.rollN) waitX += (l.x - waitX) * Math.min(1, dt * 8); }
        ball.material = ballMat(seat.bot ? seat.c : playerColor(seat.id));
      }
      ball.position.set(waitX, CONFIG.ballR, 0.3); ball.visible = !!seat;
      aimLine.visible = !!seat && seat.id === net.sessionId; aimLine.position.x = waitX;
    } else aimLine.visible = false;
    if (replay) { // the ball rolls (and spins) along its path
      const b = replay.sim.ball, sp = Math.hypot(b.vx, b.vz);
      ball.visible = !b.gone || b.z > CONFIG.pitZ - 0.5;
      if (sp > 0.01) { axis.set(b.vz / sp, 0, -b.vx / sp); ball.rotateOnWorldAxis(axis, (sp * dt) / CONFIG.ballR); }
      ball.position.set(b.x, b.gutter ? CONFIG.ballR - 0.07 : CONFIG.ballR, b.z);
      setRumble(b.gone ? 0 : 1);
    } else setRumble(0);
    drawPins(dt);
    // the camera
    const b = replay && replay.sim.ball;
    if (b && b.z < 0) { wantPos.set(b.x * 0.5, b.z < -9 ? 0.62 : 1.0, Math.max(b.z + 2.8, -15.5)); wantLook.set(b.x * 0.3, 0.1, Math.min(b.z - 6, CONFIG.headZ - 0.4)); }
    else if (camera.aspect < 1) { wantPos.set(waitX * 0.6, 1.5, 3.0); wantLook.set(waitX * 0.25, -2.4, -11); } // tall screens: tilt down so the lane fills them
    else { wantPos.set(waitX * 0.6, 1.25, 4.2); wantLook.set(waitX * 0.25, 0, -11); }
    if (now - lastHud > 120) { lastHud = now; hud(g); }
  }
  tickSparks(dt);
  const k = 1 - Math.pow(0.02, dt);
  cam.pos.lerp(wantPos, k); cam.look.lerp(wantLook, k);
  camera.position.copy(cam.pos); camera.lookAt(cam.look);
  renderer.render(scene, camera);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("roll", (m, from) => { if (isHost()) hostRoll(from, m); });
  net.on("again", () => { const g = game(); if (isHost() && g && g.phase === "done") newGame(g.id + 1); });
  net.onDisconnect(() => { $("net").textContent = "Reconnecting…"; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = takenColors();
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { seats: 4, botThinkMs: 400, settleMs: 2000, botAimErr: 0.015 });
  wantPos.copy(cam.pos); wantLook.copy(cam.look);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
